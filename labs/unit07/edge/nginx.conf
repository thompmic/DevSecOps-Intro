# CPS 5981 · Unit 07 · edge proxy (baseline configuration — do not edit before Task 4)
events { worker_connections 1024; }

http {
  log_format unit07 '$time_iso8601 "$request" status=$status '
                    'upstream=$upstream_addr ustatus=$upstream_status rt=$request_time';
  access_log /var/log/nginx/access.log unit07;
  error_log  /var/log/nginx/error.log warn;

  # Layer 1: two replicas. If one refuses connections, nginx retries the other.
  upstream juice {
    server juice-a:3000 max_fails=1 fail_timeout=10s;
    server juice-b:3000 max_fails=1 fail_timeout=10s;
  }

  server {
    listen 80;

    proxy_connect_timeout 2s;
    proxy_read_timeout    15s;
    proxy_next_upstream   error timeout http_502 http_503;
    add_header X-Served-By $upstream_addr always;

    # The health check a load balancer or uptime monitor would poll.
    location = /edge-health { access_log off; return 200 "edge ok\n"; }

    # Layer 2: every API call is introspected by the identity provider first.
    location = /_auth {
      internal;
      proxy_pass              http://idp:8081/validate;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length "";
      proxy_connect_timeout   2s;
      proxy_read_timeout      10s;
    }

    # Task 4 (Unit 07) — degradation decision.
    # The product catalogue and the client bootstrap config are anonymous-
    # readable by design: the identity provider approved them unconditionally.
    # Gating them bought no access control and cost the entire shop whenever
    # idp was unavailable (E2: 0% success; E3: 0% plus a 10 s wait per call).
    # These two routes now fail OPEN; everything else still fails CLOSED.
    location ^~ /api/Products                        { proxy_pass http://juice; }
    location = /rest/admin/application-configuration { proxy_pass http://juice; }

    location /api/  { auth_request /_auth; proxy_pass http://juice; }
    location /rest/ { auth_request /_auth; proxy_pass http://juice; }

    # Static front end (the Angular single-page app). No identity check.
    location / { proxy_pass http://juice; }
  }
}
